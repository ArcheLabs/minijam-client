name: minijam-stage0

x-worker: &worker
  image: minijam-stage0-worker:local
  pull_policy: never
  build:
    context: ../..
    dockerfile: deploy/local/Dockerfile.thin
    target: worker
  restart: unless-stopped
  depends_on:
    node:
      condition: service_healthy
    playground-api:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8082/health/ready"]
    interval: 2s
    timeout: 2s
    retries: 60
  networks: [stage0]

services:
  node:
    image: minijam-stage0-node:local
    pull_policy: never
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile.thin
      target: node
    command:
      - --dev
      - --alice
      - --base-path=/data
      - --rpc-external
      - --rpc-cors=all
      - --rpc-methods=unsafe
    ports:
      - "${MINIJAM_NODE_PORT:-9944}:9944"
    volumes:
      - node-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -fsS -H "content-type: application/json" --data "{\"id\":1,\"jsonrpc\":\"2.0\",\"method\":\"system_health\",\"params\":[]}" http://127.0.0.1:9944 >/dev/null'
      interval: 2s
      timeout: 2s
      retries: 90
    networks: [stage0]

  compiler-api:
    image: minijam-stage0-compiler-api:local
    pull_policy: never
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile.thin
      target: compiler
    environment:
      MINIJAM_COMPILER_DIRECT: "true"
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8081; printf "GET /health/ready HTTP/1.0\r\n\r\n" >&3; grep -q "204 No Content" <&3'
      interval: 2s
      timeout: 2s
      retries: 60
    networks: [stage0]

  playground-api:
    image: minijam-stage0-playground-api:local
    pull_policy: never
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile.thin
      target: playground
    environment:
      MINIJAM_PLAYGROUND_BIND: 0.0.0.0:8080
      MINIJAM_PLAYGROUND_DB: /data/playground.sqlite
      MINIJAM_BUNDLE_DIR: /data/bundles
      MINIJAM_COMPILER_URL: http://compiler-api:8081
      MINIJAM_RPC_URL: ws://node:9944
      MINIJAM_GENESIS_HASH: rpc
      MINIJAM_RELAYER_URI: ${MINIJAM_RELAYER_URI:-0x9292929292929292929292929292929292929292929292929292929292929292}
    volumes:
      - playground-data:/data
    depends_on:
      node:
        condition: service_healthy
      compiler-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health/ready"]
      interval: 2s
      timeout: 2s
      retries: 60
    networks: [stage0]

  worker-1:
    <<: *worker
    command: ["--config=/config/worker.toml"]
    volumes:
      - ./worker-1.toml:/config/worker.toml:ro
      - worker-1-data:/data

  worker-2:
    <<: *worker
    command: ["--config=/config/worker.toml"]
    volumes:
      - ./worker-2.toml:/config/worker.toml:ro
      - worker-2-data:/data

  worker-3:
    <<: *worker
    command: ["--config=/config/worker.toml"]
    volumes:
      - ./worker-3.toml:/config/worker.toml:ro
      - worker-3-data:/data

  playground-web:
    image: minijam-stage0-playground-web:local
    pull_policy: never
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile.web
      args:
        VITE_TEST_WALLET: ${MINIJAM_TEST_WALLET:-true}
    depends_on:
      playground-api:
        condition: service_healthy
    ports:
      - "${MINIJAM_WEB_PORT:-4173}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health/live"]
      interval: 2s
      timeout: 2s
      retries: 60
    networks: [stage0]

volumes:
  node-data:
  playground-data:
  worker-1-data:
  worker-2-data:
  worker-3-data:

networks:
  stage0:
