server {
    listen 8080;
    server_name _;

    location = /health/live {
        access_log off;
        return 204;
    }

    location = /health {
        proxy_pass http://playground-api:8080/health/ready;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://playground-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ipfs/ {
        proxy_pass http://playground-api:8080;
        proxy_set_header Host $host;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
