name: minijam-stage1-compact
services:
  node:
    image: ${MINIJAM_NODE_IMAGE:-ghcr.io/archelabs/minijam-node:stage1}
    command:
      - --chain=/chain-specs/stage1.json
      - --base-path=/data
      - --node-key-file=/run/secrets/node_network_key
      - --validator
      - --force-authoring
      - --unsafe-rpc-external
      - --rpc-methods=safe
      - --rpc-cors=all
    ports: ["127.0.0.1:9944:9944"]
    secrets:
      - source: node_network_key
        uid: "10001"
        gid: "10001"
        mode: 0400
    volumes:
      - node-data:/data
      - type: bind
        source: ${MINIJAM_STAGE1_CHAIN_SPEC_FILE:-./chain-specs/stage1.json}
        target: /chain-specs/stage1.json
        read_only: true
    networks: [chain, node-edge]
  worker:
    image: ${MINIJAM_WORKER_IMAGE:-ghcr.io/archelabs/minijam-worker:stage1}
    command: [--rpc-url=http://node:9944, --worker-id=0, --ipfs-gateway=http://formal-rpc:8080/ipfs, --health-bind=0.0.0.0:8082, --submit-candidates, --submit-support-votes]
    depends_on: [node]
    environment: {MINIJAM_WORKER_SEED_FILE: /run/secrets/worker_signing_key}
    secrets:
      - source: worker_signing_key
        uid: "10001"
        gid: "10001"
        mode: 0400
    volumes: [worker-data:/data]
    networks: [chain, work]
  formal-rpc:
    image: ${MINIJAM_FORMAL_RPC_IMAGE:-ghcr.io/archelabs/minijam-formal-rpc:stage1}
    depends_on: [node]
    environment:
      MINIJAM_RPC_URL: ws://node:9944
      MINIJAM_FORMAL_RPC_BIND: 0.0.0.0:8080
      MINIJAM_BUNDLE_DIR: /bundles
      MINIJAM_RELAYER_URI_FILE: /run/secrets/work_ingress_key
    secrets:
      - source: work_ingress_key
        uid: "10001"
        gid: "10001"
        mode: 0400
    volumes: [bundle-data:/bundles]
    ports: ["127.0.0.1:8080:8080"]
    networks: [chain, work]
volumes: {node-data: {}, worker-data: {}, bundle-data: {}}
networks:
  chain: {internal: true}
  work: {}
  node-edge: {}
secrets:
  node_network_key:
    environment: MINIJAM_NODE_NETWORK_KEY
  worker_signing_key:
    environment: MINIJAM_WORKER_SEED
  work_ingress_key:
    environment: MINIJAM_FORMAL_RPC_RELAYER_URI
