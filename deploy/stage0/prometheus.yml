global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: minijam-authorities
    metrics_path: /metrics
    static_configs:
      - targets:
          - authority-1:9615
          - authority-2:9615
          - authority-3:9615

  - job_name: minijam-public-rpc
    metrics_path: /metrics
    static_configs:
      - targets:
          - public-rpc:9615

  - job_name: minijam-workers
    metrics_path: /metrics
    static_configs:
      - targets:
          - worker-1:9616
          - worker-2:9616
          - worker-3:9616
