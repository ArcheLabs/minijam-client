name: M9 Stage 0 E2E

on:
  push:
    branches:
      - m9-stage0-local-e2e
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MINIJAM_IMAGE_REGISTRY: ghcr.io/archelabs
  MINIJAM_IMAGE_TAG: ${{ github.sha }}

jobs:
  m9-stage0-e2e:
    name: Build and run trusted Stage 0 E2E
    if: github.repository == 'ArcheLabs/minijam-client'
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout MiniJAM
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Check Jambda App configuration
        env:
          JAMBDA_APP_CLIENT_ID: ${{ vars.JAMBDA_APP_CLIENT_ID }}
          JAMBDA_APP_PRIVATE_KEY: ${{ secrets.JAMBDA_APP_PRIVATE_KEY }}
        run: |
          test -n "${JAMBDA_APP_CLIENT_ID}" || {
            echo "::error::JAMBDA_APP_CLIENT_ID is not configured"
            exit 1
          }
          test -n "${JAMBDA_APP_PRIVATE_KEY}" || {
            echo "::error::JAMBDA_APP_PRIVATE_KEY is not configured"
            exit 1
          }

      - name: Read pinned Jambda commit
        id: jambda-pin
        run: |
          jambda_sha="$(git ls-tree HEAD external/jambda | awk '{print $3}')"
          if [[ ! "${jambda_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unable to determine pinned Jambda commit"
            exit 1
          fi
          echo "sha=${jambda_sha}" >> "${GITHUB_OUTPUT}"

      - name: Create Jambda token
        id: jambda-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.JAMBDA_APP_CLIENT_ID }}
          private-key: ${{ secrets.JAMBDA_APP_PRIVATE_KEY }}
          owner: ArcheLabs
          repositories: jambda
          permission-contents: read

      - name: Checkout pinned Jambda
        uses: actions/checkout@v4
        with:
          repository: ArcheLabs/jambda
          ref: ${{ steps.jambda-pin.outputs.sha }}
          token: ${{ steps.jambda-token.outputs.token }}
          path: external/jambda
          fetch-depth: 1
          persist-credentials: false

      - name: Check submodule pin
        run: ./scripts/check-submodule.sh

      - name: Install Rust toolchain
        run: rustup show

      - name: Install native build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-18 \
            llvm-18-dev \
            libclang-18-dev \
            protobuf-compiler

          LLVM_CONFIG_PATH="$(command -v llvm-config-18)"
          LIBCLANG_PATH="$("${LLVM_CONFIG_PATH}" --libdir)"
          CLANG_PATH="$(command -v clang-18)"

          test -x "${LLVM_CONFIG_PATH}"
          test -x "${CLANG_PATH}"
          protoc --version
          find "${LIBCLANG_PATH}" -maxdepth 1 \
            \( -name 'libclang.so' -o -name 'libclang.so.*' \) \
            -print -quit | grep -q .

          echo "LLVM_CONFIG_PATH=${LLVM_CONFIG_PATH}" >> "${GITHUB_ENV}"
          echo "LIBCLANG_PATH=${LIBCLANG_PATH}" >> "${GITHUB_ENV}"
          echo "CLANG_PATH=${CLANG_PATH}" >> "${GITHUB_ENV}"

      - name: Restore Cargo and Rust build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            service-toolchain/compiler/polkavm-to-jam/target
          key: m9-stage0-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'service-toolchain/compiler/polkavm-to-jam/Cargo.lock') }}
          restore-keys: |
            m9-stage0-${{ runner.os }}-

      - name: Build Stage 0 release binaries
        run: |
          cargo build --locked --release \
            -p minijam-node \
            -p minijam-compiler-api \
            -p minijam-playground-api \
            -p minijam-worker
          cargo build --locked --release \
            --manifest-path service-toolchain/compiler/polkavm-to-jam/Cargo.toml
          test -x target/release/minijam-node
          test -x target/release/minijam-compiler-api
          test -x target/release/minijam-playground-api
          test -x target/release/minijam-worker

      - name: Install browser test dependencies
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/playground-web/package-lock.json

      - name: Install Chromium
        working-directory: apps/playground-web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build five local Stage 0 images
        run: |
          ./scripts/stage0-local.sh build
          for image in node compiler-api playground-api worker playground-web; do
            docker image inspect \
              "${MINIJAM_IMAGE_REGISTRY}/minijam-${image}:${MINIJAM_IMAGE_TAG}" \
              >/dev/null
          done

      - name: Reset Stage 0 volumes
        run: ./scripts/stage0-local.sh reset

      - name: Start Stage 0 Compose
        run: ./scripts/stage0-local.sh up

      - name: Run two real Stage 0 E2E flows
        run: ./scripts/stage0-local.sh test

      - name: Collect failure diagnostics
        if: failure()
        run: |
          mkdir -p stage0-diagnostics
          docker compose --project-name minijam-stage0 \
            -f deploy/local/docker-compose.yml ps --all \
            > stage0-diagnostics/compose-ps.txt 2>&1 || true
          docker compose --project-name minijam-stage0 \
            -f deploy/local/docker-compose.yml logs --no-color \
            > stage0-diagnostics/compose.log 2>&1 || true
          cp -R apps/playground-web/playwright-report stage0-diagnostics/ 2>/dev/null || true
          cp -R apps/playground-web/test-results stage0-diagnostics/ 2>/dev/null || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m9-stage0-e2e-diagnostics-${{ github.sha }}
          path: stage0-diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: Stop Stage 0 Compose
        if: always()
        run: ./scripts/stage0-local.sh down
