name: Service toolchain conformance

on:
  push:
    branches:
      - main
      - m9-stage0-local-e2e
      - m10-minimal-release
      - agent/season2-release-readiness
    paths:
      - '.github/workflows/service-toolchain.yml'
      - 'artifacts/system-service.*'
      - 'deploy/compiler/**'
      - 'deploy/local/Dockerfile'
      - 'examples/services/counter/**'
      - 'scripts/build-system-service.sh'
      - 'scripts/compile-service'
      - 'scripts/print-service-toolchain-diagnostics.sh'
      - 'scripts/test-compiler-image.sh'
      - 'scripts/test-counter-services.sh'
      - 'scripts/test-service0-provenance.sh'
      - 'service-toolchain/**'
      - 'services/system-service/**'
  pull_request:
    paths:
      - '.github/workflows/service-toolchain.yml'
      - 'artifacts/system-service.*'
      - 'deploy/compiler/**'
      - 'deploy/local/Dockerfile'
      - 'examples/services/counter/**'
      - 'scripts/build-system-service.sh'
      - 'scripts/compile-service'
      - 'scripts/print-service-toolchain-diagnostics.sh'
      - 'scripts/test-compiler-image.sh'
      - 'scripts/test-counter-services.sh'
      - 'scripts/test-service0-provenance.sh'
      - 'service-toolchain/**'
      - 'services/system-service/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  service0-provenance:
    name: Service 0 source-to-artifact provenance
    if: github.repository == 'ArcheLabs/minijam-client'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout MiniJAM
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Rebuild and validate committed Service 0 artifacts
        run: ./scripts/test-service0-provenance.sh

      - name: Upload Service 0 provenance evidence
        uses: actions/upload-artifact@v4
        with:
          name: service0-provenance-${{ github.sha }}
          path: target/minijam-service0-provenance/

  c-cpp-conformance:
    name: C/C++ toolchain conformance and Jambda execution
    if: github.repository == 'ArcheLabs/minijam-client'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout MiniJAM
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Check Jambda App configuration
        env:
          JAMBDA_APP_CLIENT_ID: ${{ vars.JAMBDA_APP_CLIENT_ID }}
          JAMBDA_APP_PRIVATE_KEY: ${{ secrets.JAMBDA_APP_PRIVATE_KEY }}
        run: |
          test -n "${JAMBDA_APP_CLIENT_ID}" || {
            echo "::error::JAMBDA_APP_CLIENT_ID is not configured"
            exit 1
          }
          test -n "${JAMBDA_APP_PRIVATE_KEY}" || {
            echo "::error::JAMBDA_APP_PRIVATE_KEY is not configured"
            exit 1
          }

      - name: Read pinned Jambda commit
        id: jambda-pin
        run: |
          jambda_sha="$(git ls-tree HEAD external/jambda | awk '{print $3}')"
          if [[ ! "${jambda_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unable to determine pinned Jambda commit"
            exit 1
          fi
          echo "sha=${jambda_sha}" >> "${GITHUB_OUTPUT}"

      - name: Create Jambda token
        id: jambda-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.JAMBDA_APP_CLIENT_ID }}
          private-key: ${{ secrets.JAMBDA_APP_PRIVATE_KEY }}
          owner: ArcheLabs
          repositories: jambda
          permission-contents: read

      - name: Checkout pinned Jambda
        uses: actions/checkout@v4
        with:
          repository: ArcheLabs/jambda
          ref: ${{ steps.jambda-pin.outputs.sha }}
          token: ${{ steps.jambda-token.outputs.token }}
          path: external/jambda
          fetch-depth: 1
          persist-credentials: false

      - name: Reproduce committed C and C++ artifacts in the compiler image
        run: ./scripts/test-compiler-image.sh

      - name: Execute reproduced artifacts through Jambda
        run: ./scripts/test-counter-services.sh

      - name: Upload toolchain diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: c-cpp-toolchain-${{ github.sha }}
          path: |
            target/minijam-compat-artifacts/manifest.tsv
            target/minijam-compat-artifacts/toolchain-diagnostics.txt
