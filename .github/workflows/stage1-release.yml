name: Stage-1 release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested images to GHCR and verify public digest pulls
        required: true
        type: boolean
        default: false
      source_ref:
        description: Branch, tag, or commit to test
        required: true
        type: string
        default: main
      release_tag:
        description: Release tag when publishing manually, for example stage1-v0.1.0
        required: false
        type: string
        default: ''

permissions:
  contents: read
  packages: write

env:
  CARGO_TERM_COLOR: always
  RUST_TEST_THREADS: 1
  MINIJAM_IMAGE_REGISTRY: ghcr.io/archelabs

jobs:
  release:
    name: Docker release gate
    if: github.repository == 'ArcheLabs/minijam-client'
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - name: Checkout exact Stage-1 source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Check Jambda App configuration
        env:
          JAMBDA_APP_CLIENT_ID: ${{ vars.JAMBDA_APP_CLIENT_ID }}
          JAMBDA_APP_PRIVATE_KEY: ${{ secrets.JAMBDA_APP_PRIVATE_KEY }}
        run: |
          test -n "${JAMBDA_APP_CLIENT_ID}" || { echo "::error::JAMBDA_APP_CLIENT_ID is not configured"; exit 1; }
          test -n "${JAMBDA_APP_PRIVATE_KEY}" || { echo "::error::JAMBDA_APP_PRIVATE_KEY is not configured"; exit 1; }

      - name: Read pinned Jambda commit
        id: jambda-pin
        run: |
          jambda_sha="$(git ls-tree HEAD external/jambda | awk '{print $3}')"
          [[ "${jambda_sha}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Unable to determine pinned Jambda commit"; exit 1; }
          echo "sha=${jambda_sha}" >> "${GITHUB_OUTPUT}"

      - name: Create Jambda token
        id: jambda-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.JAMBDA_APP_CLIENT_ID }}
          private-key: ${{ secrets.JAMBDA_APP_PRIVATE_KEY }}
          owner: ArcheLabs
          repositories: jambda
          permission-contents: read

      - name: Checkout pinned Jambda
        uses: actions/checkout@v4
        with:
          repository: ArcheLabs/jambda
          ref: ${{ steps.jambda-pin.outputs.sha }}
          token: ${{ steps.jambda-token.outputs.token }}
          path: external/jambda
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve source and image identities
        id: release
        env:
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
          REQUESTED_PUBLISH: ${{ inputs.publish }}
        run: |
          git_sha="$(git rev-parse HEAD)"
          short_sha="${git_sha:0:7}"
          release_tag="${REQUESTED_RELEASE_TAG:-stage1-dry-${short_sha}}"
          publish="${REQUESTED_PUBLISH:-false}"
          if [[ "${publish}" == true && ! "${release_tag}" =~ ^stage1-v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Invalid Stage-1 release tag: ${release_tag}"
            exit 1
          fi
          {
            echo "git_sha=${git_sha}"
            echo "short_sha=${short_sha}"
            echo "sha_tag=stage1-${short_sha}"
            echo "release_tag=${release_tag}"
            echo "publish=${publish}"
          } >> "${GITHUB_OUTPUT}"

      - name: Prepare native build dependencies
        run: bash ./scripts/install-native-build-dependencies.sh

      - name: Check Stage-1 source gates
        run: |
          ./scripts/check-stage1-core-boundary.sh
          ./scripts/check-stage1-core-dependencies.sh
          ./scripts/check-stage1-boundary.sh
          ./scripts/test-stage1-hardening.sh
          ./scripts/check-production-image-boundary.sh
          ./scripts/check-release-secret-hygiene.sh
          cargo fmt --all -- --check
          cargo check --locked -p minijam-node
          cargo check --locked -p minijam-launcher
          ./scripts/test-stage1-core.sh
          cargo check -p minijam-runtime --no-default-features --target wasm32v1-none

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Stage-1 Docker test target
        env:
          GIT_SHA: ${{ steps.release.outputs.git_sha }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          docker build --target tests \
            --build-arg GIT_SHA="${GIT_SHA}" \
            --build-arg RELEASE_TAG="${RELEASE_TAG}" \
            -f deploy/stage1/Dockerfile \
            -t "${MINIJAM_IMAGE_REGISTRY}/minijam-stage1-tests:${GIT_SHA}" .

      - name: Build candidate Stage-1 images once
        env:
          GIT_SHA: ${{ steps.release.outputs.git_sha }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          SHA_TAG: ${{ steps.release.outputs.sha_tag }}
        run: |
          for role in node worker formal-rpc minijam; do
            if [[ "${role}" == minijam ]]; then
              repository="${MINIJAM_IMAGE_REGISTRY}/minijam"
            else
              repository="${MINIJAM_IMAGE_REGISTRY}/minijam-${role}"
            fi
            docker build --target "${role}" \
              --build-arg GIT_SHA="${GIT_SHA}" \
              --build-arg RELEASE_TAG="${RELEASE_TAG}" \
              -f deploy/stage1/Dockerfile \
              -t "${repository}:${SHA_TAG}" .
          done

      - name: Generate deterministic testnet chain specs
        env:
          MINIJAM_NODE_IMAGE: ${{ env.MINIJAM_IMAGE_REGISTRY }}/minijam-node:${{ steps.release.outputs.sha_tag }}
          MINIJAM_TESTNET_CHAIN_SPEC_DIR: ${{ github.workspace }}/chain-specs
        run: ./scripts/export-testnet-chain-specs-image.sh

      - name: Check canonical testnet Compose profiles
        env:
          MINIJAM_NODE_IMAGE: ${{ env.MINIJAM_IMAGE_REGISTRY }}/minijam-node:${{ steps.release.outputs.sha_tag }}
          MINIJAM_WORKER_IMAGE: ${{ env.MINIJAM_IMAGE_REGISTRY }}/minijam-worker:${{ steps.release.outputs.sha_tag }}
          MINIJAM_FORMAL_RPC_IMAGE: ${{ env.MINIJAM_IMAGE_REGISTRY }}/minijam-formal-rpc:${{ steps.release.outputs.sha_tag }}
          MINIJAM_NODE_NETWORK_KEY: 0x1111111111111111111111111111111111111111111111111111111111111111
          MINIJAM_WORKER_SEED: 0x2222222222222222222222222222222222222222222222222222222222222222
          MINIJAM_FORMAL_RPC_RELAYER_URI: 0x3333333333333333333333333333333333333333333333333333333333333333
          MINIJAM_RPC_URL: ws://node:9944
        run: |
          docker compose -f deploy/stage1/compose.compact.yml config >/dev/null
          docker compose -f deploy/stage1/compose.split.yml config >/dev/null

      - name: Smoke candidate canonical local image
        env:
          MINIJAM_IMAGE: ${{ env.MINIJAM_IMAGE_REGISTRY }}/minijam:${{ steps.release.outputs.sha_tag }}
        run: ./scripts/test-minijam-local-e2e.sh

      - name: Log in to GHCR
        if: steps.release.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push exact candidate images
        if: steps.release.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          SHA_TAG: ${{ steps.release.outputs.sha_tag }}
        run: |
          for role in node worker formal-rpc; do
            repository="${MINIJAM_IMAGE_REGISTRY}/minijam-${role}"
            docker tag "${repository}:${SHA_TAG}" "${repository}:${RELEASE_TAG}"
            docker push "${repository}:${SHA_TAG}"
            docker push "${repository}:${RELEASE_TAG}"
          done
          repository="${MINIJAM_IMAGE_REGISTRY}/minijam"
          docker tag "${repository}:${SHA_TAG}" "${repository}:${RELEASE_TAG}"
          docker push "${repository}:${SHA_TAG}"
          docker push "${repository}:${RELEASE_TAG}"

      - name: Record published image digests
        id: digests
        if: steps.release.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          mkdir -p stage1-release
          : > stage1-image-digests.txt
          for repository in minijam-node minijam-worker minijam-formal-rpc minijam; do
            reference="${MINIJAM_IMAGE_REGISTRY}/${repository}:${RELEASE_TAG}"
            docker pull "${reference}" >/dev/null
            docker image inspect --format '{{index .RepoDigests 0}}' "${reference}" >> stage1-image-digests.txt
          done
          test "$(wc -l < stage1-image-digests.txt)" -eq 4
          test "$(sort -u stage1-image-digests.txt | wc -l)" -eq 4
          {
            echo "node=$(grep '/minijam-node@sha256:' stage1-image-digests.txt)"
            echo "worker=$(grep '/minijam-worker@sha256:' stage1-image-digests.txt)"
            echo "formal_rpc=$(grep '/minijam-formal-rpc@sha256:' stage1-image-digests.txt)"
            echo "minijam=$(grep '/minijam@sha256:' stage1-image-digests.txt)"
          } >> "${GITHUB_OUTPUT}"

      - name: Verify anonymous published digest pulls
        if: steps.release.outputs.publish == 'true'
        run: |
          docker logout ghcr.io
          while IFS= read -r reference; do
            docker image rm --force "${reference}" >/dev/null 2>&1 || true
            docker pull "${reference}"
          done < stage1-image-digests.txt

      - name: Smoke exact published aggregate digest
        if: steps.release.outputs.publish == 'true'
        env:
          MINIJAM_IMAGE: ${{ steps.digests.outputs.minijam }}
        run: |
          ./scripts/test-minijam-local-e2e.sh
          printf 'STAGE1_PUBLISHED_DIGEST_SMOKE=PASS\n'

      - name: Create release metadata
        if: steps.release.outputs.publish == 'true'
        env:
          GIT_SHA: ${{ steps.release.outputs.git_sha }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          NODE_DIGEST: ${{ steps.digests.outputs.node }}
          WORKER_DIGEST: ${{ steps.digests.outputs.worker }}
          FORMAL_RPC_DIGEST: ${{ steps.digests.outputs.formal_rpc }}
          MINIJAM_DIGEST: ${{ steps.digests.outputs.minijam }}
        run: |
          dockerfile_sha256="$(sha256sum deploy/stage1/Dockerfile | awk '{print $1}')"
          testnet_sha256="$(sha256sum chain-specs/testnet.json | awk '{print $1}')"
          testnet_raw_sha256="$(sha256sum chain-specs/testnet-raw.json | awk '{print $1}')"
          jq -n \
            --arg release_tag "${RELEASE_TAG}" \
            --arg git_commit "${GIT_SHA}" \
            --arg dockerfile_sha256 "${dockerfile_sha256}" \
            --arg node "${NODE_DIGEST}" \
            --arg worker "${WORKER_DIGEST}" \
            --arg formal_rpc "${FORMAL_RPC_DIGEST}" \
            --arg minijam "${MINIJAM_DIGEST}" \
            --arg testnet_json_sha256 "${testnet_sha256}" \
            --arg testnet_raw_json_sha256 "${testnet_raw_sha256}" \
            '{release_tag: $release_tag, git_commit: $git_commit,
              dockerfile_sha256: $dockerfile_sha256, ss58_prefix: 42,
              images: {node: $node, worker: $worker, formal_rpc: $formal_rpc, minijam: $minijam},
              chain_specs: {testnet_json_sha256: $testnet_json_sha256,
                            testnet_raw_json_sha256: $testnet_raw_json_sha256}}' \
            > stage1-release/release-manifest.json
          cp chain-specs/testnet.json stage1-release/
          cp chain-specs/testnet-raw.json stage1-release/
          cp stage1-image-digests.txt stage1-release/
          ./scripts/check-release-secret-hygiene.sh stage1-release

      - name: Create dry-validation metadata
        if: steps.release.outputs.publish != 'true'
        env:
          SHA_TAG: ${{ steps.release.outputs.sha_tag }}
        run: |
          mkdir -p stage1-release
          cp chain-specs/testnet.json stage1-release/
          cp chain-specs/testnet-raw.json stage1-release/
          {
            printf 'ghcr.io/archelabs/minijam-node:%s\n' "${SHA_TAG}"
            printf 'ghcr.io/archelabs/minijam-worker:%s\n' "${SHA_TAG}"
            printf 'ghcr.io/archelabs/minijam-formal-rpc:%s\n' "${SHA_TAG}"
            printf 'ghcr.io/archelabs/minijam:%s\n' "${SHA_TAG}"
          } > stage1-release/stage1-image-candidates.txt

      - name: Upload Stage-1 release metadata
        uses: actions/upload-artifact@v4
        with:
          name: minijam-stage1-${{ steps.release.outputs.release_tag }}
          path: |
            stage1-release/
            chain-specs/testnet.json
            chain-specs/testnet-raw.json
          if-no-files-found: error
          retention-days: 30
