name: Stage 0 Release

on:
  push:
    tags:
      - "v*-stage0*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested images to public GHCR packages
        required: true
        type: boolean
        default: false
      release_tag:
        description: Immutable Stage 0 release tag (for example v0.1.0-stage0)
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  CARGO_TERM_COLOR: always
  MINIJAM_IMAGE_REGISTRY: ghcr.io/archelabs

jobs:
  release:
    name: Build and publish Stage 0 images
    if: >-
      github.repository == 'ArcheLabs/minijam-client' &&
      (github.event_name == 'push' || inputs.publish == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout MiniJAM
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Check Jambda App configuration
        env:
          JAMBDA_APP_CLIENT_ID: ${{ vars.JAMBDA_APP_CLIENT_ID }}
          JAMBDA_APP_PRIVATE_KEY: ${{ secrets.JAMBDA_APP_PRIVATE_KEY }}
        run: |
          test -n "${JAMBDA_APP_CLIENT_ID}" || {
            echo "::error::JAMBDA_APP_CLIENT_ID is not configured"
            exit 1
          }
          test -n "${JAMBDA_APP_PRIVATE_KEY}" || {
            echo "::error::JAMBDA_APP_PRIVATE_KEY is not configured"
            exit 1
          }

      - name: Read pinned Jambda commit
        id: jambda-pin
        run: |
          jambda_sha="$(git ls-tree HEAD external/jambda | awk '{print $3}')"
          if [[ ! "${jambda_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unable to determine pinned Jambda commit"
            exit 1
          fi
          echo "sha=${jambda_sha}" >> "${GITHUB_OUTPUT}"

      - name: Create Jambda token
        id: jambda-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.JAMBDA_APP_CLIENT_ID }}
          private-key: ${{ secrets.JAMBDA_APP_PRIVATE_KEY }}
          owner: ArcheLabs
          repositories: jambda
          permission-contents: read

      - name: Checkout pinned Jambda
        uses: actions/checkout@v4
        with:
          repository: ArcheLabs/jambda
          ref: ${{ steps.jambda-pin.outputs.sha }}
          token: ${{ steps.jambda-token.outputs.token }}
          path: external/jambda
          fetch-depth: 1
          persist-credentials: false

      - name: Check submodule pin
        run: ./scripts/check-submodule.sh

      - name: Resolve immutable image tags
        id: release
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            release_tag="${GITHUB_REF_NAME}"
          else
            release_tag="${REQUESTED_TAG}"
          fi
          if [[ ! "${release_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-stage0([.-][a-zA-Z0-9.-]+)?$ ]]; then
            echo "::error::Invalid Stage 0 release tag: ${release_tag}"
            exit 1
          fi
          short_sha="${GITHUB_SHA:0:7}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "sha_tag=stage0-${short_sha}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build five Stage 0 images
        env:
          MINIJAM_IMAGE_TAG: ${{ steps.release.outputs.sha_tag }}
          MINIJAM_GIT_COMMIT: ${{ github.sha }}
          MINIJAM_JAMBDA_COMMIT: ${{ steps.jambda-pin.outputs.sha }}
          MINIJAM_TEST_WALLET: "false"
        run: |
          ./scripts/stage0-local.sh build
          for image in node compiler-api playground-api worker playground-web; do
            docker image inspect \
              "${MINIJAM_IMAGE_REGISTRY}/minijam-${image}:${MINIJAM_IMAGE_TAG}" \
              >/dev/null
          done

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable image tags
        env:
          SHA_TAG: ${{ steps.release.outputs.sha_tag }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          for image in node compiler-api playground-api worker playground-web; do
            repository="${MINIJAM_IMAGE_REGISTRY}/minijam-${image}"
            docker tag "${repository}:${SHA_TAG}" "${repository}:${RELEASE_TAG}"
            docker push "${repository}:${SHA_TAG}"
            docker push "${repository}:${RELEASE_TAG}"
          done

      - name: Record published image digests
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          : > stage0-image-digests.txt
          for image in node compiler-api playground-api worker playground-web; do
            reference="${MINIJAM_IMAGE_REGISTRY}/minijam-${image}:${RELEASE_TAG}"
            docker pull "${reference}" >/dev/null
            docker image inspect \
              --format '{{index .RepoDigests 0}}' \
              "${reference}" >> stage0-image-digests.txt
          done
          test "$(wc -l < stage0-image-digests.txt)" -eq 5

      - name: Verify anonymous digest pulls
        run: |
          docker logout ghcr.io
          while IFS= read -r reference; do
            docker image rm --force "${reference}" >/dev/null 2>&1 || true
            docker pull "${reference}"
          done < stage0-image-digests.txt

      - name: Upload image digest record
        uses: actions/upload-artifact@v4
        with:
          name: stage0-image-digests-${{ steps.release.outputs.release_tag }}
          path: stage0-image-digests.txt
          if-no-files-found: error
          retention-days: 30
