name: CI

on:
  push:
    branches:
      - main
      - m9-stage0-local-e2e
      - m10-minimal-release
      - agent/season2-release-readiness
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TEST_THREADS: 1

jobs:
  trusted-checks:
    name: Stage-1 core checks
    if: github.repository == 'ArcheLabs/minijam-client'
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout MiniJAM
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Check Stage-1 core CI boundary
        run: ./scripts/check-stage1-core-boundary.sh

      - name: Check Jambda App configuration
        env:
          JAMBDA_APP_CLIENT_ID: ${{ vars.JAMBDA_APP_CLIENT_ID }}
          JAMBDA_APP_PRIVATE_KEY: ${{ secrets.JAMBDA_APP_PRIVATE_KEY }}
        run: |
          test -n "${JAMBDA_APP_CLIENT_ID}" || {
            echo "::error::JAMBDA_APP_CLIENT_ID is not configured"
            exit 1
          }
          test -n "${JAMBDA_APP_PRIVATE_KEY}" || {
            echo "::error::JAMBDA_APP_PRIVATE_KEY is not configured"
            exit 1
          }

      - name: Read pinned Jambda commit
        id: jambda-pin
        run: |
          jambda_sha="$(git ls-tree HEAD external/jambda | awk '{print $3}')"
          if [[ ! "${jambda_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unable to determine pinned Jambda commit"
            exit 1
          fi
          echo "sha=${jambda_sha}" >> "${GITHUB_OUTPUT}"

      - name: Create Jambda token
        id: jambda-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.JAMBDA_APP_CLIENT_ID }}
          private-key: ${{ secrets.JAMBDA_APP_PRIVATE_KEY }}
          owner: ArcheLabs
          repositories: jambda
          permission-contents: read

      - name: Checkout pinned Jambda
        uses: actions/checkout@v4
        with:
          repository: ArcheLabs/jambda
          ref: ${{ steps.jambda-pin.outputs.sha }}
          token: ${{ steps.jambda-token.outputs.token }}
          path: external/jambda
          fetch-depth: 1
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup show

      - name: Restore Cargo and Rust build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains
            target
          key: season2-ci-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            season2-ci-${{ runner.os }}-
            stage0-release-${{ runner.os }}-

      - name: Install core build utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep

      - name: Check submodule pin
        run: ./scripts/check-submodule.sh

      - name: Check MiniJamSpec production boundary
        run: ./scripts/check-minijam-boundary.sh

      - name: Check production image toolchain boundary
        run: ./scripts/check-production-image-boundary.sh

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Season 2 fast gate
        run: |
          cargo test -p pallet-minijam
          cargo test -p pallet-minijam-workers
          cargo test -p minijam-playground-api
          ./scripts/test-season2-hardening.sh

      - name: Test workspace
        run: cargo test --workspace

      - name: Test long-running Jambda integration
        run: cargo test --workspace -- --ignored

      - name: Check no_std public crates
        run: >
          cargo check
          -p minijam-protocol
          -p minijam-jamcore-api
          -p minijam-worker-engine
          --no-default-features
          --target wasm32-unknown-unknown

      - name: Check runtime Wasm
        run: cargo check -p minijam-runtime --no-default-features --target wasm32v1-none

      - name: Run committed Service 0 runtime tests
        run: cargo test -p minijam-runtime --lib system_ -- --nocapture

      - name: Build release binaries
        run: |
          cargo build --release -p minijam-node
          cargo build --release -p minijam-worker

      - name: Export raw chain spec
        env:
          MINIJAM_STAGE0_RELAYER_PUBLIC_KEY: ${{ vars.MINIJAM_RELEASE_RELAYER_PUBLIC_KEY }}
        run: |
          test -n "${MINIJAM_STAGE0_RELAYER_PUBLIC_KEY}" || {
            echo "::error::MINIJAM_RELEASE_RELAYER_PUBLIC_KEY repository variable is not configured"
            exit 1
          }
          mkdir -p stage0-artifacts
          ./scripts/export-stage0-chain-specs.sh ./target/release/minijam-node chain-specs
          cp chain-specs/stage0*.json stage0-artifacts/

      - name: Collect artifacts
        run: |
          cp target/release/minijam-node stage0-artifacts/
          cp target/release/minijam-worker stage0-artifacts/
          cp target/release/wbuild/minijam-runtime/minijam_runtime*.wasm stage0-artifacts/
          cat > stage0-artifacts/build-info.json <<EOF
          {
            "minijam_client_commit": "$(git rev-parse HEAD)",
            "jambda_commit": "$(git -C external/jambda rev-parse HEAD)",
            "rust_toolchain": "$(rustc --version)",
            "polkadot_sdk_commit": "2e4dd0bc22366a5af820492528869a493b5a5208",
            "runtime_spec_version": 1,
            "runtime_wasm_blake2_256": "$(b2sum -l 256 target/release/wbuild/minijam-runtime/minijam_runtime.compact.compressed.wasm | awk '{print $1}')"
          }
          EOF

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: minijam-stage0
          path: stage0-artifacts/
