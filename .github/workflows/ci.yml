name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TEST_THREADS: 1

jobs:
  trusted-checks:
    name: Stage-1 core checks
    if: github.repository == 'ArcheLabs/minijam-client'
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout MiniJAM
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Check Stage-1 core CI boundary
        run: ./scripts/check-stage1-core-boundary.sh

      - name: Check Jambda App configuration
        env:
          JAMBDA_APP_CLIENT_ID: ${{ vars.JAMBDA_APP_CLIENT_ID }}
          JAMBDA_APP_PRIVATE_KEY: ${{ secrets.JAMBDA_APP_PRIVATE_KEY }}
        run: |
          test -n "${JAMBDA_APP_CLIENT_ID}" || {
            echo "::error::JAMBDA_APP_CLIENT_ID is not configured"
            exit 1
          }
          test -n "${JAMBDA_APP_PRIVATE_KEY}" || {
            echo "::error::JAMBDA_APP_PRIVATE_KEY is not configured"
            exit 1
          }

      - name: Read pinned Jambda commit
        id: jambda-pin
        run: |
          jambda_sha="$(git ls-tree HEAD external/jambda | awk '{print $3}')"
          if [[ ! "${jambda_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unable to determine pinned Jambda commit"
            exit 1
          fi
          echo "sha=${jambda_sha}" >> "${GITHUB_OUTPUT}"

      - name: Create Jambda token
        id: jambda-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.JAMBDA_APP_CLIENT_ID }}
          private-key: ${{ secrets.JAMBDA_APP_PRIVATE_KEY }}
          owner: ArcheLabs
          repositories: jambda
          permission-contents: read

      - name: Checkout pinned Jambda
        uses: actions/checkout@v7
        with:
          repository: ArcheLabs/jambda
          ref: ${{ steps.jambda-pin.outputs.sha }}
          token: ${{ steps.jambda-token.outputs.token }}
          path: external/jambda
          fetch-depth: 1
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup show

      - name: Restore Cargo and Rust build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains
            target
          key: minijam-ci-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            minijam-ci-${{ runner.os }}-

      - name: Check submodule pin
        run: ./scripts/check-submodule.sh

      - name: Check MiniJamSpec production boundary
        run: ./scripts/check-minijam-boundary.sh

      - name: Check production image toolchain boundary
        run: ./scripts/check-production-image-boundary.sh

      - name: Check Stage-1 core dependency boundary
        run: ./scripts/check-stage1-core-dependencies.sh

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run core fast gate
        run: |
          cargo test -p pallet-minijam
          cargo test -p pallet-minijam-workers

      - name: Test Stage-1 core
        run: ./scripts/test-stage1-core.sh

      - name: Check no_std public crates
        run: >
          cargo check
          -p minijam-protocol
          -p minijam-jamcore-api
          -p minijam-worker-engine
          --no-default-features
          --target wasm32-unknown-unknown

      - name: Check runtime Wasm
        run: cargo check -p minijam-runtime --no-default-features --target wasm32v1-none

      - name: Run committed Service 0 runtime tests
        run: cargo test -p minijam-runtime --lib system_ -- --nocapture

  stage1-images:
    name: Stage-1 image build checks
    if: github.repository == 'ArcheLabs/minijam-client'
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout MiniJAM
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Check Jambda App configuration
        env:
          JAMBDA_APP_CLIENT_ID: ${{ vars.JAMBDA_APP_CLIENT_ID }}
          JAMBDA_APP_PRIVATE_KEY: ${{ secrets.JAMBDA_APP_PRIVATE_KEY }}
        run: |
          test -n "${JAMBDA_APP_CLIENT_ID}" || {
            echo "::error::JAMBDA_APP_CLIENT_ID is not configured"
            exit 1
          }
          test -n "${JAMBDA_APP_PRIVATE_KEY}" || {
            echo "::error::JAMBDA_APP_PRIVATE_KEY is not configured"
            exit 1
          }

      - name: Read pinned Jambda commit
        id: jambda-pin
        run: |
          jambda_sha="$(git ls-tree HEAD external/jambda | awk '{print $3}')"
          if [[ ! "${jambda_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unable to determine pinned Jambda commit"
            exit 1
          fi
          echo "sha=${jambda_sha}" >> "${GITHUB_OUTPUT}"

      - name: Create Jambda token
        id: jambda-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.JAMBDA_APP_CLIENT_ID }}
          private-key: ${{ secrets.JAMBDA_APP_PRIVATE_KEY }}
          owner: ArcheLabs
          repositories: jambda
          permission-contents: read

      - name: Checkout pinned Jambda
        uses: actions/checkout@v7
        with:
          repository: ArcheLabs/jambda
          ref: ${{ steps.jambda-pin.outputs.sha }}
          token: ${{ steps.jambda-token.outputs.token }}
          path: external/jambda
          fetch-depth: 1
          persist-credentials: false

      - name: Check Stage-1 source boundaries
        run: |
          ./scripts/check-stage1-boundary.sh
          ./scripts/check-release-secret-hygiene.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Stage-1 Docker test target
        run: docker build --target tests -f deploy/stage1/Dockerfile -t minijam-stage1-tests:${GITHUB_SHA} .

      - name: Build Stage-1 production targets
        run: |
          docker build --target node -f deploy/stage1/Dockerfile -t minijam-node:stage1-ci .
          docker build --target worker -f deploy/stage1/Dockerfile -t minijam-worker:stage1-ci .
          docker build --target formal-rpc -f deploy/stage1/Dockerfile -t minijam-formal-rpc:stage1-ci .

      - name: Check Stage-1 Compose profiles
        run: |
          docker compose -f deploy/stage1/compose.compact.yml config --no-interpolate >/dev/null
          docker compose -f deploy/stage1/compose.split.yml config --no-interpolate >/dev/null
