[package]
name = "minijam-worker"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait.workspace = true
base64.workspace = true
clap = { workspace = true, features = ["derive"] }
futures.workspace = true
jam-codec = { version = "0.1.1", default-features = false }
jambda-minijam-executive = { path = "../../external/jambda/crates/minijam-executive", features = ["std"] }
jambda-minijam-spec = { path = "../../external/jambda/crates/minijam-spec" }
jambda-refine = { path = "../../external/jambda/crates/refine", default-features = false }
jambda-state-backend = { path = "../../external/jambda/crates/state-backend" }
jp-core-primitives = { path = "../../external/jambda/crates/core-primitives", default-features = false }
jp-vm-engine = { path = "../../external/jambda/vm/engine", features = ["std"] }
jp-vm-interp = { path = "../../external/jambda/vm/interp", features = ["std"] }
jsonrpsee = { workspace = true, features = ["ws-client"] }
minijam-protocol = { path = "../minijam-protocol" }
minijam-chain-client = { path = "../minijam-chain-client" }
minijam-runtime = { path = "../../runtime" }
pallet-minijam = { path = "../../pallets/minijam" }
parity-scale-codec.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["std"] }
sp-core = { workspace = true, default-features = true }
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true
