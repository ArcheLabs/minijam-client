[package]
name = "minijam-worker-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = { workspace = true, optional = true }
bounded-collections.workspace = true
cid = { workspace = true, optional = true }
jam-codec = { version = "0.1.1", default-features = false, optional = true }
jambda-refine = { path = "../../external/jambda/crates/refine", default-features = false, optional = true }
jp-core-primitives = { path = "../../external/jambda/crates/core-primitives", default-features = false, optional = true }
minijam-protocol = { path = "../minijam-protocol", default-features = false }
parity-scale-codec.workspace = true
scale-info.workspace = true

[dev-dependencies]
futures.workspace = true

[features]
default = ["std"]
std = [
  "dep:async-trait",
  "dep:cid",
  "dep:jam-codec",
  "dep:jambda-refine",
  "dep:jp-core-primitives",
  "bounded-collections/std",
  "jambda-refine/std",
  "jp-core-primitives/std",
  "minijam-protocol/std",
  "parity-scale-codec/std",
  "scale-info/std",
]
